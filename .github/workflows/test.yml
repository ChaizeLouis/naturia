name: Tests Naturia — Playwright

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build app
        run: npm run build

      - name: Setup serve structure
        run: |
          mkdir -p serve-root/NUTRICORE
          cp -r out/* serve-root/NUTRICORE/
          cp out/index.html serve-root/index.html

      - name: Install serve
        run: npm install -g serve

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000/NUTRICORE

      - name: Upload screenshots & report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            test-results/
          retention-days: 7
