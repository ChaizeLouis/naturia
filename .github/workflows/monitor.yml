name: Monitoring Naturia — Toutes les heures

on:
  schedule:
    - cron: '0 * * * *'  # Toutes les heures
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Test site actif
        id: test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L https://naturia.ch --max-time 15 || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "✅ naturia.ch accessible (HTTP $STATUS)"
          else
            echo "⚠️ naturia.ch status: $STATUS — test sur Vercel"
          fi

      - name: Run Playwright on production
        run: npx playwright test
        env:
          CI: true
          BASE_URL: https://naturia.ch
        continue-on-error: true

      - name: Alert Make if site down
        if: failure()
        run: |
          curl -X POST https://hook.eu1.make.com/otchv73pv3ffjwflwm8js9haf9mzi6jj \
            -H "Content-Type: application/json" \
            -d "{\"title\":\"🚨 Naturia DOWN ou bug détecté\",\"url\":\"https://naturia.ch\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"critical\"}"

      - name: Upload monitoring results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-${{ github.run_number }}
          path: test-results/
          retention-days: 3
